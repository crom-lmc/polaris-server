<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <defs>
    <style>
      .title   { font-size:19px; font-weight:700; fill:#1f2733; }
      .layer   { font-size:13px; font-weight:600; fill:#8a94a6; letter-spacing:2px; }
      .box     { stroke-width:1.2; }
      .name    { font-size:14px; font-weight:600; fill:#1f2733; }
      .sub     { font-size:11.5px; fill:#6b7686; }
      .db      { fill:#fdf6ec; stroke:#e7c98a; }
      .db .name{ fill:#8a6420; }
      .fe      { fill:#eef4ff; stroke:#9bbcf0; }
      .fe .name{ fill:#1d4f91; }
      .gw      { fill:#e8f7f0; stroke:#5fc79a; }
      .gw .name{ fill:#0f7a52; }
      .svc     { fill:#f4f1fd; stroke:#b3a4e6; }
      .svc .name{ fill:#5b3fa8; }
      .infra   { fill:#f2f4f7; stroke:#c3ccd8; }
      .infra .name{ fill:#465364; }
      .edge    { stroke:#b8c2d0; stroke-width:1.4; fill:none; marker-end:url(#arr); }
      .edgeDash{ stroke:#c3ccd8; stroke-width:1.2; fill:none; stroke-dasharray:5 4; marker-end:url(#arr2); }
      .note    { font-size:11px; fill:#98a2b3; }
    </style>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b8c2d0"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c3ccd8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="800" fill="#ffffff"/>
  <text class="title" x="40" y="36">Polaris 平台架构</text>

  <!-- ===== 前端层 ===== -->
  <text class="layer" x="40" y="68">前端应用（Vue 3 · ant-design-vue 4）</text>
  <g>
    <rect class="box fe" x="40"  y="80" width="160" height="58" rx="10"/>
    <text class="name" x="120" y="104" text-anchor="middle">sso-web</text>
    <text class="sub"  x="120" y="123" text-anchor="middle">统一账号中心 :5173</text>

    <rect class="box fe" x="212" y="80" width="160" height="58" rx="10"/>
    <text class="name" x="292" y="104" text-anchor="middle">ehr-web</text>
    <text class="sub"  x="292" y="123" text-anchor="middle">人力中心 :5179</text>

    <rect class="box fe" x="384" y="80" width="160" height="58" rx="10"/>
    <text class="name" x="464" y="104" text-anchor="middle">settings-web</text>
    <text class="sub"  x="464" y="123" text-anchor="middle">配置中心 :5180</text>

    <rect class="box fe" x="556" y="80" width="160" height="58" rx="10"/>
    <text class="name" x="636" y="104" text-anchor="middle">cms-web</text>
    <text class="sub"  x="636" y="123" text-anchor="middle">内容中心 :5177</text>

    <rect class="box fe" x="728" y="80" width="160" height="58" rx="10"/>
    <text class="name" x="808" y="104" text-anchor="middle">portal-web</text>
    <text class="sub"  x="808" y="123" text-anchor="middle">内容门户 :5178</text>

    <rect class="box fe" x="900" y="80" width="160" height="58" rx="10"/>
    <text class="name" x="980" y="104" text-anchor="middle">blog-web</text>
    <text class="sub"  x="980" y="123" text-anchor="middle">博客（web/admin）</text>
  </g>

  <!-- 前端 -> 网关（汇入总线） -->
  <g>
    <path class="edge" d="M120,138 L120,164 L550,164 L550,196"/>
    <path class="edge" d="M292,138 L292,164 L550,164"/>
    <path class="edge" d="M464,138 L464,164 L550,164"/>
    <path class="edge" d="M636,138 L636,164 L550,164"/>
    <path class="edge" d="M808,138 L808,164 L550,164"/>
    <path class="edge" d="M980,138 L980,164 L550,164"/>
  </g>

  <!-- ===== 网关层 ===== -->
  <text class="layer" x="40" y="188">统一入口</text>
  <rect class="box gw" x="380" y="198" width="340" height="64" rx="10"/>
  <text class="name" x="550" y="224" text-anchor="middle">sso-gateway :9080</text>
  <text class="sub"  x="550" y="244" text-anchor="middle">JWT(RS256) 校验 · 吊销名单轮询 · 路由转发 · 内部 token</text>

  <!-- 网关 -> 服务（分散出口，避免叠线） -->
  <g>
    <path class="edge" d="M420,262 L420,292 L120,292 L120,320"/>
    <path class="edge" d="M460,262 L460,292 L292,292 L292,320"/>
    <path class="edge" d="M500,262 L500,292 L464,292 L464,320"/>
    <path class="edge" d="M600,262 L600,292 L636,292 L636,320"/>
    <path class="edge" d="M640,262 L640,292 L808,292 L808,320"/>
    <path class="edge" d="M680,262 L680,292 L980,292 L980,320"/>
  </g>

  <!-- ===== 服务层 ===== -->
  <text class="layer" x="40" y="310">微服务（Spring Cloud · MyBatis-Plus）</text>
  <g>
    <rect class="box svc" x="40"  y="320" width="160" height="64" rx="10"/>
    <text class="name" x="120" y="344" text-anchor="middle">sso-auth :9001</text>
    <text class="sub"  x="120" y="362" text-anchor="middle">登录认证 / Token 签发</text>

    <rect class="box svc" x="212" y="320" width="160" height="64" rx="10"/>
    <text class="name" x="292" y="344" text-anchor="middle">sso-account :9002</text>
    <text class="sub"  x="292" y="362" text-anchor="middle">账号 / 角色权限</text>

    <rect class="box svc" x="384" y="320" width="160" height="64" rx="10"/>
    <text class="name" x="464" y="344" text-anchor="middle">ehr :9006</text>
    <text class="sub"  x="464" y="362" text-anchor="middle">组织 / 员工 / 假勤 / 公告</text>

    <rect class="box svc" x="556" y="320" width="160" height="64" rx="10"/>
    <text class="name" x="636" y="344" text-anchor="middle">settings :9007</text>
    <text class="sub"  x="636" y="362" text-anchor="middle">字典 / 单号 / 审批 / 安全</text>

    <rect class="box svc" x="728" y="320" width="160" height="64" rx="10"/>
    <text class="name" x="808" y="344" text-anchor="middle">cms :9004</text>
    <text class="sub"  x="808" y="362" text-anchor="middle">文章 / 栏目 / 门户配置</text>

    <rect class="box svc" x="900" y="320" width="160" height="64" rx="10"/>
    <text class="name" x="980" y="344" text-anchor="middle">portal :9005</text>
    <text class="sub"  x="980" y="362" text-anchor="middle">门户聚合（只读）</text>
  </g>

  <!-- blog-web 直连 blog（右侧绕行走廊） -->
  <path class="edgeDash" d="M1040,138 L1040,156 L1088,156 L1088,482 L1068,482"/>
  <text class="note" x="1096" y="300" transform="rotate(90 1096 300)">blog-web 直连（不经网关）</text>

  <!-- 服务 -> 库 -->
  <g>
    <path class="edge" d="M120,384 L120,482"/>
    <path class="edge" d="M292,384 L292,482"/>
    <path class="edge" d="M464,384 L464,482"/>
    <path class="edge" d="M636,384 L636,482"/>
    <path class="edge" d="M808,384 L808,482"/>
  </g>
  <!-- portal -> cms 库（只读聚合，虚线） -->
  <path class="edgeDash" d="M980,384 L980,430 L860,430 L860,482"/>
  <text class="note" x="920" y="422" text-anchor="middle">portal 只读聚合 cms 库</text>

  <!-- ===== 数据层 ===== -->
  <text class="layer" x="1080" y="470" text-anchor="end">数据存储（MySQL 5.7+ · 分库）</text>
  <g>
    <rect class="box db" x="70"  y="482" width="240" height="58" rx="10"/>
    <text class="name" x="190" y="506" text-anchor="middle">sso_ms</text>
    <text class="sub"  x="190" y="524" text-anchor="middle">账号 / 角色权限 / 登录日志</text>

    <rect class="box db" x="384" y="482" width="160" height="58" rx="10"/>
    <text class="name" x="464" y="506" text-anchor="middle">ehr</text>
    <text class="sub"  x="464" y="524" text-anchor="middle">组织 / 员工 / 公告</text>

    <rect class="box db" x="556" y="482" width="160" height="58" rx="10"/>
    <text class="name" x="636" y="506" text-anchor="middle">settings</text>
    <text class="sub"  x="636" y="524" text-anchor="middle">字典 / 规则 / 配置</text>

    <rect class="box db" x="728" y="482" width="160" height="58" rx="10"/>
    <text class="name" x="808" y="506" text-anchor="middle">cms</text>
    <text class="sub"  x="808" y="524" text-anchor="middle">文章 / 栏目</text>
  </g>

  <!-- blog 独立链路 -->
  <rect class="box svc" x="900" y="482" width="160" height="58" rx="10"/>
  <text class="name" x="980" y="506" text-anchor="middle">blog :9003</text>
  <text class="sub"  x="980" y="524" text-anchor="middle">博客接口（独立链路）</text>
  <path class="edge" d="M980,540 L980,586"/>
  <rect class="box db" x="900" y="588" width="160" height="58" rx="10"/>
  <text class="name" x="980" y="612" text-anchor="middle">blog</text>
  <text class="sub"  x="980" y="630" text-anchor="middle">博客数据（手动 migrate）</text>

  <!-- ===== 基础设施 ===== -->
  <text class="layer" x="40" y="672">基础设施</text>
  <g>
    <rect class="box infra" x="40" y="684" width="220" height="64" rx="10"/>
    <text class="name" x="150" y="708" text-anchor="middle">Nacos</text>
    <text class="sub"  x="150" y="726" text-anchor="middle">配置中心（ENC 密文）/ 注册中心</text>

    <rect class="box infra" x="280" y="684" width="160" height="64" rx="10"/>
    <text class="name" x="360" y="708" text-anchor="middle">Redis</text>
    <text class="sub"  x="360" y="726" text-anchor="middle">验证码 / 会话 / 缓存</text>

    <rect class="box infra" x="460" y="684" width="260" height="64" rx="10"/>
    <text class="name" x="590" y="708" text-anchor="middle">polaris-nacos（配置包）</text>
    <text class="sub"  x="590" y="726" text-anchor="middle">local 入库 · prod 不入库 · .secrets 密钥</text>
  </g>

  <!-- 图例 -->
  <text class="note" x="40" y="782">实线：请求调用　·　虚线：聚合 / 外部依赖　·　所有服务启动自动执行 schema.sql + data.sql（幂等，blog 手动）</text>
</svg>
