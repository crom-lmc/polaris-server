# ============================================================
# 443 兜底 server：拒绝未配置域名的 TLS 握手
# ------------------------------------------------------------
# 背景：443 上原本没有任何 default_server，nginx 会拿「第一个出现的
#      443 块」（按 conf.d 字母序 = blogadmin.conf）当兜底，导致任何
#      未配置过的域名指向本机时，会看到【博客管理后台登录页】并下发
#      别人的证书——既泄漏内容，又触发浏览器证书告警。
#
# 作用：未在 server_name 中声明的域名（含不带 SNI、直接用 IP 访问
#      https://<公网IP>）在 TLS 握手阶段即被拒绝，不返回任何内容。
#
# 依赖：ssl_reject_handshake 需 nginx >= 1.19.4（本机 1.28.3 ✅）
# 由发布脚本下发到 /etc/nginx/conf.d/00-default-ssl.conf
# 生效：nginx -t && nginx -s reload
# 撤销：删除本文件后 reload 即恢复原行为
# ============================================================
server {
    listen 443 ssl default_server;
    server_name _;

    # 不再握手、不证书、不返回任何 HTTP 响应
    ssl_reject_handshake on;
}
