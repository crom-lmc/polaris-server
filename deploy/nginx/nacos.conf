# ============================================================
# nacos.laimengchao.site 公网入口已停用（2026-10-30）
# Nacos 仅允许通过 SSH 隧道访问：本机 18848 -> 172.17.0.1:8848
# 443 / 8848 的 TLS 握手由 00-default-ssl.conf / 00-default-ports.conf
# 的 default_server + ssl_reject_handshake 兜底拒绝，此处不再配 server 块。
# 恢复公网入口：使用服务器上的 nacos.conf.bak-20261030-tunnel（有意不入库）
#   然后 sudo nginx -t && sudo nginx -s reload
# 由发布脚本下发到 /etc/nginx/conf.d/nacos.conf
# ============================================================

# 80：明确 404，避免请求落到 80 的默认博客静态站造成困惑
server {
    listen 80;
    server_name nacos.laimengchao.site;
    return 404;
}
