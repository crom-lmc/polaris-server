# Internal listeners: tengine -> here (plain HTTP on docker bridge).
# Same static + /api behavior as the public 443 blocks.

server {
    listen 172.17.0.1:18080;
    server_name polaris-sso.laimengchao.site;
    client_max_body_size 20m;
    root /opt/polaris/www/sso;
    index index.html;
    include /etc/nginx/snippets/polaris-api.inc;
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 172.17.0.1:18080;
    server_name polaris-ehr.laimengchao.site;
    client_max_body_size 20m;
    root /opt/polaris/www/ehr;
    index index.html;
    include /etc/nginx/snippets/polaris-api.inc;
    location /uploads/ { proxy_pass http://127.0.0.1:9080; proxy_set_header Host $host; }
    location / { try_files $uri $uri/ /index.html; }
}

