# ============================================================
# 非 443 端口的 default_server 兜底
# 8082(fishing) 已随雷池下线；80 端口改为直接断连
# 由发布脚本下发到 /etc/nginx/conf.d/00-default-ports.conf
# 注意：8848 绑定本机内网地址，迁移到其他机器时要改成新机器的内网 IP，
#      否则 nginx -t 会因 bind 失败而报错。
# ============================================================

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 10.2.4.8:8848 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    access_log off;
}
