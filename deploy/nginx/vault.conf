# Vaultwarden 站点（第 9 个站点）：整站经雷池 tengine(8443)，WebSocket 通道直连 8083
# 由发布脚本下发到 /etc/nginx/conf.d/vault.conf；原样来自线上，修改前请先核对行为。
server {
    listen 443 ssl;
    include /etc/nginx/snippets/security.inc;
    server_name vault.laimengchao.site;

    ssl_certificate     /etc/nginx/certs/vault/vault.laimengchao.site_nginx/vault.laimengchao.site_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/vault/vault.laimengchao.site_nginx/vault.laimengchao.site.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 密码库附件上传，先放宽到 525MB
    client_max_body_size 525m;

    # WebSocket：客户端实时同步通道，必须单独带 Upgrade 头
    location /notifications/hub {
        proxy_pass http://172.17.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
