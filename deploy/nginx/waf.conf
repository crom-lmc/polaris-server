# ---------- 80：强制跳转 HTTPS ----------
server {
    listen 80;
    server_name waf.laimengchao.site;
    return 301 https://$host$request_uri;
}

# ---------- 443：雷池控制台 ----------
# 雷池控制台本体监听 127.0.0.1:9443（自签证书），这里用域名证书统一收口。
server {
    listen 443 ssl;
    server_name waf.laimengchao.site;

    ssl_certificate     /etc/nginx/certs/waf.laimengchao.site/waf.laimengchao.site_nginx/waf.laimengchao.site_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/waf.laimengchao.site/waf.laimengchao.site_nginx/waf.laimengchao.site.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 100m;

    location / {
        proxy_pass https://127.0.0.1:9443;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
