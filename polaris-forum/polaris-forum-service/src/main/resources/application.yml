server:
  port: ${FORUM_PORT:9009}

spring:
  application:
    name: forum
  config:
    import: "optional:nacos:forum.yaml?group=${SSO_NACOS_GROUP:SSO}&refreshEnabled=true"
  cloud:
    nacos:
      server-addr: ${SSO_NACOS_ADDR:${NACOS_SERVER_ADDR:127.0.0.1:8848}}
      username: ${SSO_NACOS_USER:${NACOS_USERNAME:nacos}}
      password: ${SSO_NACOS_PASSWORD:${NACOS_PASSWORD:}}
      config:
        enabled: ${SSO_NACOS_ENABLED:false}
        namespace: ${SSO_NACOS_NAMESPACE:sso-ms-local}
        group: ${SSO_NACOS_GROUP:SSO}
        file-extension: yaml
        refresh-enabled: true
      discovery:
        enabled: ${SSO_NACOS_DISCOVERY:false}
        group: ${SSO_NACOS_GROUP:SSO}
        namespace: ${SSO_NACOS_NAMESPACE:sso-ms-local}
  datasource:
    url: ${FORUM_DB_URL:jdbc:mysql://127.0.0.1:3306/forum?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${FORUM_DB_USER:root}
    password: ${FORUM_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
  sql:
    init:
      mode: ${FORUM_SQL_INIT_MODE:always}
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

forum:
  upload:
    root: ${FORUM_UPLOAD_ROOT:./uploads/forum}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.laimengchao.sso.forum.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false

sso:
  forum:
    app-code: forum
    app-secret: ${FORUM_APP_SECRET:}
    admin-app-code: forum-admin
    admin-app-secret: ${FORUM_ADMIN_APP_SECRET:}

logging:
  level:
    root: info
    com.laimengchao.sso.forum: debug
    org.springframework.security: warn
