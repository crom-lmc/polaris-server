# env    : local  (namespace sso-ms-local)
# dataId : blog-admin.yaml   group: SSO
# Secrets are AES-GCM ciphertext (ENC + base64 payload), see tools/SecretTool.java.
# The master key exists ONLY in the SSO_CONF_KEY environment variable / .env file.
# IMPORTANT: keep this file pure ASCII. Spring reads the fetched content with the JVM
#            default charset (GBK on zh-CN Windows); non-ASCII bytes make snakeyaml fail
#            with MalformedInputException and the config silently falls back to the jar.

spring:
  datasource:
    # local MySQL 5.7, same host as the services; the blog database is shared with
    # the legacy monolith (Blob-Backend) so existing content keeps working
    url: jdbc:mysql://${BLOG_DB_HOST:127.0.0.1}:${BLOG_DB_PORT:3306}/blog?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ENC(+BK/jDTRbae6/5jmEl/+5RqgLsPGKOZtStD4NWfkAy8=)
    password: ENC(XIhVLZcB+PQVzCNuaneCs03DwqckJOPDNycAndiYHAA=)
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

blog:
  # reader site reaches the API through the gateway, so the sitemap and canonical
  # links must point at the gateway, not at the service port
  site:
    base-url: http://127.0.0.1:9080
  upload:
    root: ./uploads
    url-prefix: /uploads

logging:
  level:
    com.laimengchao.sso.blog: INFO
