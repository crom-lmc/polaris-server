# env    : local  (namespace sso-ms-local)
# dataId : sso-auth.yaml
# group  : SSO
# Secrets are AES-GCM ciphertext (ENC + base64 payload), see tools/SecretTool.java.
# The master key exists ONLY in the SSO_CONF_KEY environment variable / .env file.
# IMPORTANT: keep this file pure ASCII. Spring reads the fetched content with the JVM
#            default charset (GBK on zh-CN Windows); non-ASCII bytes make snakeyaml fail
#            with MalformedInputException and the config silently falls back to the jar.

# note: access-ttl is the worst-case logout delay -- the gateway keeps a revocation cache,
#       so a revoked access token stays valid at most this long. Do not inflate it.

sso:
  auth:
    issuer: sso-auth
    access-ttl-seconds: 7200        # 2h
    refresh-ttl-seconds: 2592000    # 30d
    # direct call for local debugging; use lb://sso-account to exercise service discovery
    account-base-url: http://127.0.0.1:9002
    # must be identical to sso.account.internal-token in sso-account.yaml
    internal-token: ENC(hcM+Ls49h/7uFXkVr6xB7WWiXhlPD+7jUa0k2P1a+p7iXzQGwQXxpccT1yro7JXN2p2yKOnNErFl+d9qmO9sT+X9BPZKCZfb/wyBOA==)
    account-timeout-millis: 3000
    # revocation list storage: redis (shared across instances, survives auth restart) / memory
    revocation-store: redis
    # ---- central session + cross-app SSO ----
    # session-store: where the SSO cookie -> accountId mapping lives (redis / memory)
    session-store: redis
    # 7 days: the window in which any registered app will not ask for the password again
    session-ttl-seconds: 604800
    session-cookie-name: SSO_SID
    # local dev: empty domain => host-only cookie on localhost
    session-cookie-domain: ""
    session-cookie-secure: false
    session-cookie-same-site: Lax
    # one-time ticket lifetime; exchanged immediately, so 60s is plenty
    ticket-ttl-seconds: 60
    # RS256 private key as inline PEM, encrypted. The jar contains the public key ONLY.
    private-key: ENC()

logging:
  level:
    com.laimengchao.sso: INFO
