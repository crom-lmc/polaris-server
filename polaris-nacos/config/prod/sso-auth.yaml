# env    : prod  (namespace sso-ms-prod)
# dataId : sso-auth.yaml
# group  : SSO
# Secrets are AES-GCM ciphertext (ENC + base64 payload), see tools/SecretTool.java.
# The master key exists ONLY in the SSO_CONF_KEY environment variable / .env file.
# IMPORTANT: keep this file pure ASCII. Spring reads the fetched content with the JVM
#            default charset (GBK on zh-CN Windows); non-ASCII bytes make snakeyaml fail
#            with MalformedInputException and the config silently falls back to the jar.

# note: prod uses service discovery (lb://), requires SSO_NACOS_DISCOVERY=true.
#       prod has its OWN RSA keypair (nacos/.secrets/prod-jwt-*.pem): a token forged on a
#       dev machine is rejected here, and vice versa.

sso:
  auth:
    issuer: sso-auth
    access-ttl-seconds: 7200        # 2h, worst-case logout delay
    refresh-ttl-seconds: 2592000    # 30d, rotated on every use
    account-base-url: lb://sso-account
    internal-token: ENC(9iJGPbUP9f09u4VfJSfZi1SVu40A1IyvoKrOZ9i3ZPYExpr8cvE2vmr8FVH5FX+eil5gebCp1vb9Bod/HtOndnfXK7pEY5dvYDD7UA==)
    account-timeout-millis: 3000
    # revocation list storage: redis so it is shared and survives restarts
    revocation-store: redis
    # ---- central session + cross-app SSO ----
    session-store: redis
    session-ttl-seconds: 604800
    session-cookie-name: SSO_SID
    # MUST be the parent domain, otherwise sso/blog subdomains do not share the cookie
    # and single sign-on silently degrades to "log in on every site"
    session-cookie-domain: ".laimengchao.site"
    session-cookie-secure: true
    # Lax keeps the cookie on top-level cross-site navigation (needed by SSO redirects)
    # while blocking cross-site XHR; Strict would break single sign-on entirely
    session-cookie-same-site: Lax
    ticket-ttl-seconds: 60
    # encrypted PKCS#8 PEM, decrypted at startup
    private-key: ENC()
    # the public key is not a secret; inline so auth and gateway always agree
    public-key: |
      -----BEGIN PUBLIC KEY-----
      MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAoMbVEy4Va5R6LRNVPx6r
      q3lS7ylIxwny9CYfFtAas96vxp3nAJvqF8SKL64tYPQLoLXjqAr0m/z3n0IvSQg5
      I9tS5dlau2qn3ge4erd+mo6XqGfdehWxWfCjnhBdSw7yNXr61wVxqxgpeE1gORvj
      IkoSOBfF8ucrvmSeG0wxcFRnRpPTkXRSIGZpQJR019fsXWAE7tdMjrUvCjRSFQCa
      g877QnnTyc/J9vTl32llFKRsGeCI4ubv5fPSoAKbP+81qNCRuREXD5lQx8ZbaN+W
      yO53F0jjRFduA0Io8yI5R2zUAp8w0xGX98IVvzRZ/lj9tpn5YplAdvo4nMPnjjy6
      EQIDAQAB
      -----END PUBLIC KEY-----

logging:
  level:
    com.laimengchao.sso: INFO
