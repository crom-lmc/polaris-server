# env    : prod  (namespace sso-ms-prod)
# dataId : cms.yaml   group: SSO
# Credentials come from env vars so no plaintext lands here.
# IMPORTANT: keep this file pure ASCII.

spring:
  datasource:
    url: jdbc:mysql://${SSO_CMS_DB_HOST:120.53.9.119}:${SSO_CMS_DB_PORT:3306}/cms?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${SSO_CMS_DB_USER}
    password: ${SSO_CMS_DB_PASSWORD}
  sql:
    init:
      mode: never

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

cms:
  site:
    base-url: https://sso.laimengchao.site
  upload:
    root: /data/uploads-cms
    url-prefix: /api/cms/media/file

sso:
  cms:
    app-code: cms
    auth-base-url: http://sso-auth:9001
