# env    : prod  (namespace sso-ms-prod)
# dataId : sso-gateway.yaml
# group  : SSO
# Secrets are AES-GCM ciphertext (ENC + base64 payload), see tools/SecretTool.java.
# The master key exists ONLY in the SSO_CONF_KEY environment variable / .env file.
# IMPORTANT: keep this file pure ASCII. Spring reads the fetched content with the JVM
#            default charset (GBK on zh-CN Windows); non-ASCII bytes make snakeyaml fail
#            with MalformedInputException and the config silently falls back to the jar.

# WARNING: spring.cloud.gateway.routes is a List; a list from Nacos REPLACES the whole
#          default list from the jar, so every route must be listed here.

spring:
  cloud:
    gateway:
      routes:
        - id: sso-auth
          uri: lb://sso-auth
          predicates:
            - Path=/api/auth/**
        - id: sso-account
          uri: lb://sso-account
          predicates:
            - Path=/api/accounts/**,/api/roles/**,/api/permissions/**,/api/applications/**
        - id: blog-admin
          uri: lb://blog-admin
          predicates:
            - Path=/api/blog/**
        - id: blog-uploads
          uri: lb://blog-admin
          predicates:
            - Path=/uploads/**
        - id: cms
          uri: lb://cms
          predicates:
            - Path=/api/cms/**
        - id: portal
          uri: lb://portal
          predicates:
            - Path=/api/portal/**

sso:
  gateway:
    issuer: sso-auth
    # how often to poll the revocation list from auth (smaller = faster logout, more load)
    revocation-sync-millis: 5000
    # lb:// prefix switches RevocationCache to the load-balanced WebClient
    auth-base-url: lb://sso-auth
    # prod verifies with the prod public key above, matching sso-auth.yaml
    public-key: |
      -----BEGIN PUBLIC KEY-----
      MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAoMbVEy4Va5R6LRNVPx6r
